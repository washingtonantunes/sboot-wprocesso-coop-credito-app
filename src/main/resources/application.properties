# ======================================================================
# Properties base (sempre carregado). Valores de PRODUCAO.
# Perfis (local, h2, docker, test) sobrescrevem APENAS o que diverge.
# Ver docs/PROPERTIES.md para o padrao de organizacao.
# ======================================================================

#CONTEXTO, PORTA
server.servlet.context-path=/sboot-wprocesso-coop-credito-app
server.port=8082

#DATASOURCE
spring.datasource.url=jdbc:mysql://localhost/coop_credito?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

#MESSAGES
spring.messages.basename=messages,uk-messages
spring.messages.encoding=UTF-8

#JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

#Logging
logging.level.root=info

#ACTUATOR
management.endpoints.web.exposure.include=health

#HIKARI POOL
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

#JWT (token de usuario logado; mesma chave do back que emite o token)
jwt.secret=${JWT_SECRET}
jwt.expiracao=24h

#JWT INTERNO (chave propria do canal back-for-back - endpoints /api/**)
jwt.interno.secret=${JWT_INTERNO_SECRET}

#INTEGRACAO - Cadastro
app.cadastro.endpoint=${CADASTRO_URL}
app.cadastro.timeout=10s
app.cadastro.max-response-size=1MB

#TOMCAT (aumento do limite p/ acomodar o JWT com muitas funcionalidades)
server.max-http-request-header-size=16KB

#CACHE
spring.cache.type=redis
app.cache.prefixo=wprocesso-coop-credito::

#REDIS
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s
spring.data.redis.repositories.enabled=false
