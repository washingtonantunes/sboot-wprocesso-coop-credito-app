# ======================================================================
# Perfil H2 (dev com banco em memoria). Apenas chaves que DIVERGEM do base.
# Chaves ausentes aqui sao herdadas do base. Ver docs/PROPERTIES.md.
# ======================================================================

#DATASOURCE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:coop_credito;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=dev
spring.datasource.password=dev

#JPA
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#INICIALIZACAO DE DADOS
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema/h2/00-limpar-schema.sql,classpath:db/schema/mysql/01-criar-schema.sql,classpath:db/schema/mysql/02-criar-indices.sql,classpath:db/schema/h2/03-criar-sequencia-revisao.sql
spring.sql.init.data-locations=classpath:data-h2.sql

#H2 CONSOLE
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

#Logging
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=INFO

#JWT (token de usuario logado; mesma chave do back que emite o token)
jwt.secret=seguranca-dev-secret-key-that-is-at-least-32-bytes-long

#JWT INTERNO (chave propria do canal back-for-back - endpoints /api/**)
jwt.interno.secret=interno-dev-secret-key-that-is-at-least-32-bytes-long

#INTEGRACAO - Cadastro
app.cadastro.endpoint=http://localhost:8081/sboot-wprocesso-coop-cadastro-app

#CACHE
spring.cache.type=simple

#HEALTH (profile sem Redis)
management.health.redis.enabled=false
