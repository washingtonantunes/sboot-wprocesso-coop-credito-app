# ======================================================================
# Perfil DOCKER. Apenas chaves que DIVERGEM de application.properties base.
# Chaves ausentes aqui sao herdadas do base. Ver docs/PROPERTIES.md.
# ======================================================================

#DATASOURCE
spring.datasource.url=jdbc:mysql://mysql:3306/coop_credito?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

#JPA
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

#INICIALIZACAO DE DADOS
spring.sql.init.mode=never
spring.sql.init.data-locations=classpath:data-local.sql

#Logging
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=INFO

#ACTUATOR
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

#JWT (token de usuario logado; mesma chave do back que emite o token)
jwt.secret=seguranca-dev-secret-key-that-is-at-least-32-bytes-long

#JWT INTERNO (chave propria do canal back-for-back - endpoints /api/**)
jwt.interno.secret=interno-dev-secret-key-that-is-at-least-32-bytes-long

#REDIS
spring.data.redis.host=redis

#INTEGRACAO - Cadastro
app.cadastro.endpoint=http://cadastro:8081/sboot-wprocesso-coop-cadastro-app
