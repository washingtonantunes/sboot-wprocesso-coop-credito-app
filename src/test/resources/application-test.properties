# ======================================================================
# Perfil TEST (testes de integracao). Apenas chaves que DIVERGEM do
# application.properties base. Chaves ausentes aqui sao herdadas do base.
# Ver docs/PROPERTIES.md.
# ======================================================================

#DATASOURCE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=test
spring.datasource.password=test

#JPA
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=none

# Cache de segundo nivel desabilitado
spring.jpa.properties.hibernate.cache.use_second_level_cache=false

# Desabilitar SQL logging (a menos que precise debugar)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema/h2/00-limpar-schema.sql,classpath:db/schema/mysql/01-criar-schema.sql,classpath:db/schema/mysql/02-criar-indices.sql,classpath:db/schema/h2/03-criar-sequencia-revisao.sql

# Desabilitar console H2 em testes
spring.h2.console.enabled=false

# Reduzir logs desnecessarios em testes
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.test=INFO
logging.level.br.com.wti=DEBUG

#JWT
jwt.secret=test-secret-key-for-testing-only-32bytes
jwt.interno.secret=test-interno-secret-key-for-testing-32bytes

#CADASTRO
app.cadastro.endpoint=http://localhost:8081/sboot-wprocesso-coop-cadastro-app
